- name: ADC
  path: other/ADC.html
  belong: Technology
  description: |
    Antibody-Drug Conjugates (ADCs) are targeted cancer therapies that combine antibodies with cytotoxic drugs.

- name: CAR-T
  path: other/CAR-T.html
  belong: Technology
  description: |
    Chimeric Antigen Receptor T-cell Therapy (CAR-T) is a revolutionary cancer treatment that genetically engineers T-cells to fight cancer.

- name: Immune Checkpoint
  path: other/Immune_Checkpoint.html
  belong: Technology
  description: |
    Immune checkpoints are regulatory immune pathways such as PD-1, PD-L1, and CTLA-4 that maintain tolerance and are targeted by cancer immunotherapy.

- name: Biomarker
  path: other/Biomarker.html
  belong: Clinical Trial
  description: |
    Biomarkers are biological molecules used as indicators of a biological state or condition, crucial in disease diagnosis and therapy assessment.

- name: Toxicity - RT
  path: AE/Toxicity_RT.html
  belong: Clinical Trial
  description: |
    Radiotherapy toxicity covers acute and late radiation-related adverse events, classified by timing, organ system, treatment field, CTCAE terms, dose-volume factors, and attribution in oncology trials.

- name: Toxicity - Cisplatin
  path: AE/Toxicity_Cisplatin.html
  belong: Clinical Trial
  description: |
    Cisplatin-related toxicity covers nephrotoxicity, nausea and vomiting, myelosuppression, peripheral neuropathy, ototoxicity, electrolyte abnormalities, hypersensitivity, and trial safety analysis.

- name: Biomarker Expression
  path: other/Biomarker_Expression.html
  belong: Clinical Trial
  description: |
    Biomarker expression describes how much gene or protein signal is detected in tumor or immune cells, including PD-L1 negative, low-expression, and high-expression categories.

- name: Cancer Staging
  path: other/Cancer_Staging.html
  belong: Clinical Trial
  description: |
    Cancer staging classifies tumor extent and spread, guides oncology treatment strategy, trial eligibility, stratification, endpoint selection, and subgroup analysis.

- name: TNM Staging
  path: other/TNM_Staging.html
  belong: Clinical Trial
  description: |
    TNM staging describes tumor extent using primary tumor, regional lymph node, and distant metastasis categories, and is central to oncology treatment decisions and trial design.

- name: ECOG Performance Status
  path: other/ECOG_Performance_Status.html
  belong: Clinical Trial
  description: |
    ECOG Performance Status is a standard oncology functional status scale used for treatment decisions, trial eligibility, stratification, and prognosis.

- name: RECIST 1.1
  path: other/RECIST_1_1.html
  belong: Clinical Trial
  description: |
    RECIST 1.1 is the standard imaging-based response assessment framework for solid tumor trials and supports ORR, BOR, DOR, and PFS derivations.

- name: Immunotherapy
  path: other/Immunotherapy.html
  belong: Technology
  description: |
    Cancer immunotherapy activates or restores antitumor immunity through checkpoint inhibitors, CAR-T cells, bispecific antibodies, vaccines, and other immune-based strategies.

- name: TME
  path: other/TME.html
  belong: Technology
  description: |
    Tumor microenvironment (TME) describes the immune, stromal, vascular, extracellular matrix, and signaling context that shapes tumor progression, drug response, and oncology trial biomarkers.

- name: MAT
  path: other/MAT.html
  belong: Technology
  description: |
    Monoclonal Antibody Therapy (MAT) involves the use of monoclonal antibodies to specifically target and treat various diseases, including cancer and autoimmune disorders.

- name: PFS
  path: other/PFS.html
  belong: Endpoint
  description: |
    Progression-Free Survival (PFS) is a measure of the time patients remain in remission without their disease progressing after treatment.
